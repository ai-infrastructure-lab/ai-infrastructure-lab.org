items:
  - title: III 2026
    date: 2026-07-04
    author: Andreas Liesenfeld
    status: published
    body: |
        Latest work by Andreas Liesenfeld and Ulrich Ufer (KIT ITAS) on "Downtown speeding: Tracing co-evolution and colocation of data center assemblages in Frankfurt" accepted at [8th Innovation in Information Infrastructures Workshop (III)](https://www.tilmeld.dk/iii26). See you in October in Copenhagen!

  - title: New member
    date: 2026-01-11
    author: Andreas Liesenfeld
    status: published
    body: |
      Welcoming new researchers Dick Blankvoort and Arya Golkhandan to the lab. Both started working on the European Open Source AI Index project.

  - title: Birth of the AI Infrastructure lab funded by NWO Impact Explorer grant
    date: 2025-05-28
    author: Andreas Liesenfeld
    status: published
    body: |
      The AI Infrastructure lab was made possible through an Impact Explorer grant (2025) by the Dutch Research Council (NWO) awarded to Mark Dingemanse and Andreas Liesenfeld.
