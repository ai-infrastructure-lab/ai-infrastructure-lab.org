items:
  - title: 8th Innovation in Information Infrastructures Workshop (III)
    date: 2026-07-04
    author: Andreas Liesenfeld
    status: published
    body: |
        Latest work by Ulrich Ufer (KIT ITAS) and Andreas Liesenfeld on AI-related information infrastructure "Need for speed: Tracing co-evolution and colocation of data center assemblages in Frankfurt" accepted at III 2026. See you in Copenhagen!

  - title: New lab members
    date: 2026-01-11
    author: Andreas Liesenfeld
    status: published
    body: |
      New members Dick Blankvoort and Arya Golkhandan start working on the 'European Open Source AI Index' project.

  - title: NWO Impact Explorer grant
    date: 2025-05-28
    author: Andreas Liesenfeld
    status: published
    body: |
      Impact Explorer grant by the Dutch Research Council (NWO) awarded to Mark Dingemanse and Andreas Liesenfeld to support work on designing AI Infrastructure walks for diverse participants ranging from highschoolers to domain experts. Preliminary walks planned in Karlsruhe and Frankfurt (Germany). 
